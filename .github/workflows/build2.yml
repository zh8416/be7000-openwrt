name: Build Mini

on:
  workflow_dispatch:
    inputs:
      warm:
        description: "Only warm the compiler cache for mini-debug-* builds (image as a debug build does, no feed, no release)"
        type: boolean
        default: false
  push:
    tags: ["mini-v*", "mini-debug-*"]

env:
  OWRT_REPO: https://github.com/openwrt/openwrt.git
  OWRT_COMMIT: d958caff0c9ffa215dceb0718caad7d4955d8954
  VERSION_STRING: r20260929-d958caf
  FEED_BASE: mini-d958caf
  CCACHE_MAXSIZE: 2G
  ARCH: aarch64_cortex-a73
  TARGET: qualcommbe/ipq95xx
  DEVICE: openwrt-qualcommbe-ipq95xx-xiaomi_be7000

permissions:
  contents: write

concurrency:
  group: build2-${{ inputs.warm && 'warm' || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Check out OpenWrt and apply the port
        run: |
          . repo/patches/port/BASE
          [ "$OWRT_COMMIT" = "${{ env.OWRT_COMMIT }}" ] || {
            echo "::error::OWRT_COMMIT in the workflow is not the one in patches/port/BASE ($OWRT_COMMIT)"; exit 1; }
          git init -q owrt
          cd owrt
          git remote add origin "$OWRT_REPO"
          git fetch -q --depth 1 origin "$OWRT_COMMIT"
          git checkout -q FETCH_HEAD
          git -c user.name="Timofey Maykov" -c user.email="itnitro@gmail.com" am -q ../repo/patches/port/*.patch
          git log --oneline -8
          echo "$VERSION_STRING" > version

      - name: Apply patches and overlay
        run: |
          cd owrt
          cp ../repo/patches/*.patch target/linux/qualcommbe/patches-6.18/
          cp ../repo/patches/mac80211-ath12k/*.patch package/kernel/mac80211/patches/ath12k/
          cp ../repo/patches/mac80211-subsys/*.patch package/kernel/mac80211/patches/subsys/
          for p in ../repo/patches/tree/*.patch; do
            patch -p1 --dry-run -f < "$p" > /dev/null || { echo "::error::$p does not apply"; patch -p1 --dry-run -f < "$p"; exit 1; }
            patch -p1 --no-backup-if-mismatch < "$p"
          done
          if find . -name '*.rej' -o -name '*.orig' | grep -q .; then
            echo "::error::rejected hunks left behind"; find . -name '*.rej' -o -name '*.orig'; exit 1
          fi
          mkdir -p files
          cp -a ../repo/overlay-files/. files/
          case "${{ github.ref_name }}" in
            mini-debug-*) cp -a ../repo/overlay-files-debug/. files/; echo "debug overlay added" ;;
          esac
          cp -a ../repo/awg-feed .
          cp -a ../repo/awg-proto-feed .
          cp -a ../repo/beam-apps-feed .
          cp -a ../repo/luci-theme-nimbus package/

      - name: Use mini custom feeds
        run: |
          cd owrt
          ls -la files/etc/apk/repositories.d/
          cp files/etc/apk/repositories.d/customfeeds2.list \
             files/etc/apk/repositories.d/customfeeds.list
          ls -la files/etc/apk/repositories.d/

      - name: Signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          cd owrt
          if [ -z "$APK_SIGNING_KEY" ]; then
            echo "APK_SIGNING_KEY secret is not set" >&2
            exit 1
          fi
          printf '%s\n' "$APK_SIGNING_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem 2>/dev/null
          echo "public key sha256: $(sha256sum public-key.pem | cut -c1-16)"

      - name: Install public key into the image
        run: |
          cd owrt
          mkdir -p files/etc/apk/keys
          cp public-key.pem files/etc/apk/keys/beam-wrt.pem
          ls -l files/etc/apk/keys/

      - name: Pin and install feeds
        run: |
          cd owrt
          while read -r name rev _; do
            [ -n "$name" ] || continue
            sed -i -E "s|^(src-git(-full)? $name [^ ^;]+).*$|\1^$rev|" feeds.conf.default
          done < ../repo/feeds-pins.txt
          while read -r name url rev _; do
            [ -n "$name" ] || continue
            case "$name" in \#*) continue ;; esac
            echo "src-git $name $url^$rev" >> feeds.conf.default
          done < ../repo/feeds-extra.conf
          echo "=== feeds.conf.default ==="
          cat feeds.conf.default
          for name in $(cut -d" " -f1 ../repo/feeds-pins.txt); do
            grep -q "^src-git\(-full\)\? $name .*\^" feeds.conf.default || { echo "pin for $name did not apply" >&2; exit 1; }
          done
          if grep -E "^src-git(-full)? " feeds.conf.default | grep -v "\^"; then
            echo "::error::unpinned feed in feeds.conf.default, add it to feeds-pins.txt"; exit 1
          fi
          grep -q '^src-link awg ' feeds.conf.default || echo "src-link awg $PWD/awg-feed" >> feeds.conf.default
          grep -q '^src-link awgproto ' feeds.conf.default || echo "src-link awgproto $PWD/awg-proto-feed" >> feeds.conf.default
          grep -q '^src-link beamextras ' feeds.conf.default || echo "src-link beamextras $PWD/beam-apps-feed" >> feeds.conf.default
          ./scripts/feeds update -a
          byedpi_ver=$(sed 's/^v//' feeds/byedpi/.last_release_tag)
          sed -i "s/PKG_VERSION:=@VERSION@/PKG_VERSION:=$byedpi_ver/" feeds/byedpi/byedpi/Makefile
          sed -i 's/^\$(eval \$(call BuildPackage,\$(PKG_NAME)))$/# call BuildPackage - OpenWrt buildroot signature/' feeds/netshift/luci-app-netshift/Makefile
          rm -rf feeds/netshift.tmp
          ./scripts/feeds update -i netshift
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd owrt
          cp ../repo/config2.buildinfo .config
          echo "CONFIG_SIGNED_PACKAGES=y" >> .config
          echo "CONFIG_SIGNATURE_CHECK=y" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          case "${{ github.ref_name }}:${{ inputs.warm }}" in
            mini-debug-*|*:true) echo "CONFIG_PACKAGE_tcpdump-mini=y" >> .config ;;
          esac
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            mini-v*) REL="${TAG#mini-v}" ;;
            mini-debug-*) REL="$TAG" ;;
            *) REL="" ;;
          esac
          if [ -n "$REL" ]; then
            {
              echo "CONFIG_IMAGEOPT=y"
              echo "CONFIG_VERSIONOPT=y"
              echo "CONFIG_VERSION_DIST=\"Beam WRT Mini\""
              echo "CONFIG_VERSION_NUMBER=\"$REL\""
              echo "CONFIG_VERSION_CODE=\"$VERSION_STRING\""
              echo "CONFIG_VERSION_MANUFACTURER=\"Beam WRT\""
              echo "CONFIG_VERSION_MANUFACTURER_URL=\"https://github.com/timofey-maykov/be7000-openwrt\""
              echo "CONFIG_VERSION_HOME_URL=\"https://github.com/timofey-maykov/be7000-openwrt\""
              echo "CONFIG_VERSION_BUG_URL=\"https://github.com/timofey-maykov/be7000-openwrt/issues\""
              echo "CONFIG_VERSION_SUPPORT_URL=\"https://4pda.to/forum/index.php?showtopic=1070166\""
              echo "CONFIG_VERSION_PRODUCT=\"Xiaomi BE7000\""
              echo "# CONFIG_VERSION_FILENAMES is not set"
              echo "# CONFIG_VERSION_CODE_FILENAMES is not set"
            } >> .config
          fi
          make defconfig
          grep -E '^CONFIG_VERSION_NUMBER|^# CONFIG_VERSION_FILENAMES' .config || true
          case "${{ github.ref_name }}:${{ inputs.warm }}" in
            mini-debug-*|*:true)
              sed -i '/^CONFIG_PACKAGE_kmod-/!s/^\(CONFIG_PACKAGE_[^=]*\)=m$/# \1 is not set/' .config
              make defconfig
              ;;
          esac
          echo "packages as modules: $(grep -c '=m$' .config)"
          grep -q '^CONFIG_CCACHE=y' .config || { echo "::error::CONFIG_CCACHE did not survive defconfig"; exit 1; }

      - name: Cache toolchain and sources
        uses: actions/cache@v4
        with:
          path: |
            owrt/dl
            owrt/build_dir/host*
            owrt/build_dir/toolchain*
            owrt/staging_dir/host*
            owrt/staging_dir/toolchain*
          key: owrt-mini-${{ env.OWRT_COMMIT }}-${{ hashFiles('repo/feeds-pins.txt') }}
          restore-keys: |
            owrt-mini-${{ env.OWRT_COMMIT }}-

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: owrt/.ccache
          key: ccache-mini-${{ env.OWRT_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-mini-${{ env.OWRT_COMMIT }}-

      - name: Download sources
        run: cd owrt && make -j"$(nproc)" download

      - name: Build toolchain and kernel
        run: |
          cd owrt
          make -j"$(nproc)" tools/install toolchain/install || make -j1 V=s tools/install toolchain/install
          make -j"$(nproc)" target/linux/compile || make -j1 V=s target/linux/compile

      - name: Point the image at its kernel-module feed
        run: |
          cd owrt
          VERMAGIC=$(cat build_dir/target-*/linux-*/linux-*/.vermagic)
          echo "VERMAGIC=$VERMAGIC" >> "$GITHUB_ENV"
          f=files/etc/apk/repositories.d/customfeeds.list
          sed -i "s|feed2/targets/$TARGET/packages/packages.adb|feed2/targets/$TARGET/$VERMAGIC/packages/packages.adb|" "$f"
          grep "feed2/" "$f"
          TAG="${{ github.ref_name }}"
          case "$TAG" in mini-v*) VER="${TAG#mini-v}"; VER="${VER%%-*}" ;; mini-debug-*) VER="$TAG" ;; *) VER=dev ;; esac
          {
            echo "VERSION=$VER"
            echo "TAG=$TAG"
            echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BUILD=${{ github.run_id }}"
            echo "KERNEL=$VERMAGIC"
            echo "FEED=$FEED_BASE"
          } > files/etc/be7000-release
          cat files/etc/be7000-release

      - name: Build everything
        run: |
          cd owrt
          make -j"$(nproc)" world || make -j1 V=s world

      - name: ccache statistics
        if: always()
        run: cd owrt && (staging_dir/host/bin/ccache -s 2>/dev/null || ccache -s 2>/dev/null || echo "no ccache binary yet")

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: be7000-firmware-mini
          path: |
            owrt/bin/targets/qualcommbe/ipq95xx/*.ubi
            owrt/bin/targets/qualcommbe/ipq95xx/*.bin
            owrt/bin/targets/qualcommbe/ipq95xx/*.manifest
            owrt/bin/targets/qualcommbe/ipq95xx/sha256sums
          if-no-files-found: error

      - name: Check the image is clean
        run: |
          cd owrt
          img=bin/targets/$TARGET/$DEVICE-squashfs-factory.ubi
          ls -la "$img" bin/targets/$TARGET/$DEVICE-squashfs-sysupgrade.bin
          ! grep -rlE "hfdbg|HFDBG|192\.168\.11\." build_dir/target-*/root-qualcommbe/etc || {
            echo "personal or debug files in the rootfs" >&2; exit 1; }
          case "${{ github.ref_name }}" in
            mini-debug-*) test -e build_dir/target-*/root-qualcommbe/etc/be7000-debug ;;
            *) ! test -e build_dir/target-*/root-qualcommbe/etc/be7000-debug ;;
          esac
          test -L build_dir/target-*/root-qualcommbe/etc/rc.d/S99be7000-bootconfirm
          ! test -e build_dir/target-*/root-qualcommbe/etc/be7000-test

      - name: Publish the feed
        if: "!startsWith(github.ref, 'refs/tags/mini-debug-') && !inputs.warm"
        run: |
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pages
          cd pages
          for d in awg awgproto beamextras base byedpi kenzok8 luci netshift packages zapret zapret2; do
            [ -d "../owrt/bin/packages/$ARCH/$d" ] || continue
            mkdir -p "feed2/$FEED_BASE/$ARCH/$d"
            rsync -a --delete "../owrt/bin/packages/$ARCH/$d/" "feed2/$FEED_BASE/$ARCH/$d/"
          done
          cp "../owrt/bin/packages/$ARCH/sha256sums" "feed2/$FEED_BASE/$ARCH/sha256sums"
          mkdir -p "feed2/targets/$TARGET/$VERMAGIC/packages"
          rsync -a --delete "../owrt/bin/targets/$TARGET/packages/" "feed2/targets/$TARGET/$VERMAGIC/packages/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A feed2
          if git diff --cached --quiet -- feed2; then
            echo "feed unchanged"
          else
            n=$(find "feed2/$FEED_BASE/$ARCH" -name '*.apk' | wc -l)
            k=$(find "feed2/targets/$TARGET/$VERMAGIC" -name '*.apk' | wc -l)
            git commit -q -m "feed: $n userspace packages and $k kernel modules for $VERMAGIC (${{ github.ref_name }})"
            for i in 1 2 3 4 5; do
              git push -q origin gh-pages && break
              [ $i = 5 ] && exit 1
              sleep $((i * 10))
              git pull -q --rebase origin gh-pages
            done
          fi

      - name: Package the release
        if: startsWith(github.ref, 'refs/tags/mini-v') || startsWith(github.ref, 'refs/tags/mini-debug-')
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            mini-debug-*) VER="$TAG"; ZIP="be7000-openwrt-passwall2-$TAG.zip" ;;
            *) VER="${TAG#mini-v}"; VER="${VER%%-*}"; ZIP="be7000-openwrt-passwall2-v$VER.zip" ;;
          esac
          mkdir -p out/zip
          cd out
          cp "../owrt/bin/targets/$TARGET/$DEVICE-squashfs-factory.ubi" .
          cp "../owrt/bin/targets/$TARGET/$DEVICE-squashfs-sysupgrade.bin" .
          cp "../owrt/bin/targets/$TARGET/$DEVICE.manifest" .
          sha256sum "$DEVICE-squashfs-factory.ubi" "$DEVICE-squashfs-sysupgrade.bin" > sha256sums.txt
          cp "$DEVICE-squashfs-factory.ubi" ../repo/scripts/install-from-stock.sh \
             ../repo/scripts/rollback-to-stock.sh ../repo/docs/instruction/*.txt sha256sums.txt zip/
          sed -i "1s/версия [0-9][0-9.]*/версия $VER/" zip/instruction.txt
          sed -i "1s/version [0-9][0-9.]*/version $VER/" zip/instruction-en.txt
          (cd zip && zip -q -X "../$ZIP" ./*)
          sha256sum "$ZIP"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/mini-v') || startsWith(github.ref, 'refs/tags/mini-debug-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          notes=../repo/docs/release-notes/${{ github.ref_name }}.md
          if [ -f "$notes" ]; then
            printf '\n\nSHA-256 of %s\n%s\n' "$ZIP" "$(sha256sum "$ZIP" | cut -d' ' -f1)" >> "$notes"
            args=(--notes-file "$notes")
          else
            args=(--generate-notes)
          fi
          assets=("$ZIP" "$DEVICE-squashfs-factory.ubi" \
                  "$DEVICE-squashfs-sysupgrade.bin" "$DEVICE.manifest" sha256sums.txt)
          if gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" -R "${{ github.repository }}" --clobber "${assets[@]}"
          else
            case "${{ github.ref_name }}" in
              mini-debug-*) gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --prerelease \
                         --title "Beam WRT Mini, debug ${{ github.ref_name }}" "${args[@]}" "${assets[@]}" ;;
              *) gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --latest \
                   --title "Beam WRT Mini $VER" "${args[@]}" "${assets[@]}" ;;
            esac
          fi
